name: Deploy Casino Frontend

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get AWS account id
        run: echo "AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_ENV

      - name: Update frontend container on instances via SSM
        run: |
          ACCOUNT=${{ env.AWS_ACCOUNT_ID }}
          REGION=${{ secrets.AWS_REGION }}
          FRONTEND_IMAGE="$ACCOUNT.dkr.ecr.$REGION.amazonaws.com/casino-frontend:latest"
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --comment "Update casino frontend container" \
            --targets "Key=tag:Role,Values=casino" \
            --parameters commands=["docker login -u AWS -p $(aws ecr get-login-password --region $REGION) $ACCOUNT.dkr.ecr.$REGION.amazonaws.com","docker pull $FRONTEND_IMAGE","docker rm -f frontend || true","docker run -d --restart unless-stopped --name frontend -p 8080:80 $FRONTEND_IMAGE"] \
            --region $REGION

      - name: Describe stack outputs
        run: |
          aws cloudformation describe-stacks --stack-name casino --query "Stacks[0].Outputs" --output table || true
