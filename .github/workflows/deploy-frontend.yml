name: Deploy Frontend

on:
  push:
    branches: [ "deploy" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # CORREGIDO: Ahora el paso está bien alineado
      - name: Create .env file
        run: |
          echo "VITE_API_URL=http://${{ secrets.BACKEND_IP }}:3000" > .env
          echo "REACT_APP_API_URL=http://${{ secrets.BACKEND_IP }}:3000" >> .env

      - name: Build and Push to ECR
        run: |
          docker build -t casino-frontend .
          docker tag casino-frontend:latest ${{ steps.login-ecr.outputs.registry }}/casino-frontend:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/casino-frontend:latest

      - name: Deploy to EC2 via SSM
        run: |
          aws ssm send-command \
            --instance-ids ${{ secrets.EC2_FRONTEND_INSTANCE_ID }} \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":[
              "sudo chmod 666 /var/run/docker.sock",
              "docker network create casino-net || true",
              "aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}",
              "docker pull ${{ steps.login-ecr.outputs.registry }}/casino-frontend:latest",
              "docker stop frontend || true",
              "docker rm frontend || true",
              "docker run -d --restart unless-stopped --network casino-net --name frontend -p 80:8080 ${{ steps.login-ecr.outputs.registry }}/casino-frontend:latest"
            ]}'